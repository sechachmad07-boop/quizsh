<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizPlay - Result</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">Quiz<span>Play</span></a>
  </nav>

  <main class="container result-page">
    <div class="result-card">
      <div class="result-icon">✓</div>
      <p class="eyebrow">QUIZ COMPLETED</p>
      <h1 id="result-title">Great job!</h1>
      <div class="score"><span id="score">0</span><small>/ 100</small></div>
      <div class="result-stats">
        <div><strong id="correct">0</strong><span>Correct</span></div>
        <div><strong id="wrong">0</strong><span>Wrong</span></div>
        <div><strong id="total">0</strong><span>Total</span></div>
      </div>
      <p id="result-message" class="result-message"></p>
      <div class="hero-buttons center">
        <a id="retry" class="btn primary">Try Again</a>
        <a href="explore.html" class="btn secondary">Explore More</a>
      </div>
    </div>
  </main>

  <script src="js/result.js"></script>
</body>
</html>
