<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizPlay - Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">Quiz<span>Play</span></a>
    <a href="explore.html" class="back-link">← Exit Quiz</a>
  </nav>

  <main class="container quiz-page">
    <div id="quiz-app" class="quiz-box">
      <div class="quiz-top">
        <span id="quiz-title"></span>
        <span id="question-count"></span>
      </div>
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="question-area">
        <p id="question-number" class="eyebrow"></p>
        <h1 id="question"></h1>
        <div id="options" class="options"></div>
      </div>
      <button id="next-btn" class="btn primary full-btn" disabled>Next Question</button>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
