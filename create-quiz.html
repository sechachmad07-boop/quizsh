<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizPlay - Create Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="index.html">Quiz<span>Play</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="create-quiz.html" class="active">Create Quiz</a>
    </div>
  </nav>

  <main class="container page narrow">
    <div class="page-heading">
      <p class="eyebrow">CREATOR</p>
      <h1>Create Your Quiz</h1>
      <p>Make your own quiz and save it in this browser.</p>
    </div>

    <form id="quiz-form" class="form-card">
      <label>Quiz Title<input id="title" required placeholder="e.g. Basic Programming"></label>
      <label>Description<textarea id="description" placeholder="Short description..."></textarea></label>
      <div class="form-row">
        <label>Category
          <select id="new-category">
            <option>IT</option><option>Cybersecurity</option><option>English</option><option>General</option>
          </select>
        </label>
        <label>Difficulty
          <select id="new-difficulty">
            <option>Easy</option><option>Medium</option><option>Hard</option>
          </select>
        </label>
      </div>

      <div id="questions"></div>
      <button type="button" id="add-question" class="btn secondary full-btn">+ Add Question</button>
      <button type="submit" class="btn primary full-btn">Save Quiz</button>
      <p id="form-message" class="form-message"></p>
    </form>
  </main>

  <script src="js/create.js"></script>
</body>
</html>
